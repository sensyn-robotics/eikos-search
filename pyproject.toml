[project]
name = "eikos-search"
version = "0.1.0"
description = "Answers a question with the exact sentence of an existing web article, chosen by Eikos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Masahiro Ogawa", email = "masahiro.ogaw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "ddgs>=9.16.0",
    "eikos",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
eikos-search = "eikos_search.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
eikos = { path = "third_party/eikos", editable = true }
