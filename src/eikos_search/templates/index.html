<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eikos-search</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --mark:#fde68a; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524; --line:#44403c; --mark:#854d0e; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:8px;
          background:var(--card); color:var(--fg); }
  button { padding:10px 16px; font:inherit; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { margin-top:24px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .quote { font-size:1.15rem; }
  .context { color:var(--muted); margin-top:16px; }
  mark { background:var(--mark); color:inherit; padding:0 2px; border-radius:3px; }
  .src { margin-top:16px; font-size:.9rem; }
  .src a { color:var(--accent); word-break:break-all; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>eikos-search</h1>
  <p class="sub">Answers are exact sentences from existing articles, chosen by Eikos. Nothing is generated.</p>
  <form id="f"><input id="q" placeholder="Ask a question" autofocus><button id="b">Search</button></form>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const safeUrl = (u) => { try { const x = new URL(u); return ["http:", "https:"].includes(x.protocol) ? x.href : null; } catch { return null; } };

function render(a) {
  const card = el("div", "card");
  if (!a.found) {
    card.append(el("div", "quote", "No article states this exactly."));
  } else {
    card.append(el("div", "quote", `“${a.text}”`));
    if (a.paragraph && a.paragraph !== a.text) {
      const ctx = el("div", "context"), i = a.offset_in_paragraph;
      ctx.append(a.paragraph.slice(0, i), el("mark", null, a.text), a.paragraph.slice(i + a.text.length));
      card.append(ctx);
    }
    const src = el("div", "src"), url = safeUrl(a.url);
    src.append(el("div", null, a.title || ""));
    if (url) { const l = el("a", null, url); l.href = url; l.target = "_blank"; l.rel = "noopener noreferrer"; src.append(l); }
    card.append(src);
  }
  card.append(el("div", "meta", `p(sentence) = ${a.probability.toFixed(2)} · p(answered) = ${a.answered.toFixed(2)} · ${a.candidates} sentences from ${a.articles} articles · ${a.seconds.toFixed(1)} s`));
  $("out").replaceChildren(card);
}

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("b").disabled = true; $("out").replaceChildren(el("div", "card meta", "Searching…"));
  try {
    const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    render(await r.json());
  } catch (e) {
    $("out").replaceChildren(el("div", "card", `Error: ${e.message}`));
  } finally { $("b").disabled = false; }
});
</script>
</body>
</html>
